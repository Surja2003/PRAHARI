# Mosquitto for the ONVIF Profile M MQTT/JSON binding.
#
# Anonymous access is fine ONLY on an isolated outpost VLAN. Before any
# pilot, put a password file here and turn allow_anonymous off -- alert
# metadata is operational intelligence even without the video attached.

listener 1883 0.0.0.0
allow_anonymous true
# password_file /mosquitto/config/passwd
# allow_anonymous false

persistence true
persistence_location /mosquitto/data/

# Hold queued alerts for a C2 that is offline. This is the northbound half
# of store-and-forward: the outpost keeps producing while the link is down.
max_queued_messages 10000
queue_qos0_messages false

log_dest stdout
log_type warning
log_type error
connection_messages true
