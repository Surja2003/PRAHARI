[project]
name = "prahari"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.110",
	"uvicorn[standard]>=0.29",
	"pydantic>=2.6",
	"python-multipart>=0.0.9",
	"opencv-python-headless>=4.9",
	"numpy>=1.26",
	"PyYAML>=6.0",
	"paho-mqtt>=2.0",
]

[tool.vercel]
entrypoint = "prahari.server.app:app"
